services:
  # PHP-FPM application
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: entreprises_php
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      - mysql
      - redis
    networks:
      - entreprises

  # Nginx web server
  nginx:
    image: nginx:alpine
    container_name: entreprises_nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - entreprises

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: entreprises_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-laravel}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - entreprises

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: entreprises_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - entreprises

  # Vite dev server (hot-reload)
  vite:
    image: node:20-alpine
    container_name: entreprises_vite
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - php
    networks:
      - entreprises

volumes:
  mysql_data:

networks:
  entreprises:
    driver: bridge
